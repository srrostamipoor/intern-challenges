---
- name: Install Python and pip
  apt:
    name:
      - python3
      - python3-pip
    state: present
    install_recommends: false
  register: py_install
  retries: 3
  delay: 5
  until: py_install is succeeded

- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    mode: "0755"

- name: Install Flask
  pip:
    name: flask
    state: present

- name: Deploy app file
  copy:
    src: app.py
    dest: "{{ app_dir }}/app.py"
    owner: "{{ deploy_user }}"
    mode: "0644"
  notify: Restart app

- name: Create systemd unit for the app
  copy:
    content: |
      [Unit]
      Description=Python App
      After=network.target

      [Service]
      User={{ deploy_user }}
      WorkingDirectory={{ app_dir }}
      ExecStart=/usr/bin/python3 {{ app_dir }}/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/myapp.service
    mode: "0644"
  notify: Restart app

- name: Enable and start app (systemd)
  systemd:
    name: myapp
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Start app (no systemd, container fallback)
  command: >
    start-stop-daemon --start --background --make-pidfile
    --pidfile /run/myapp.pid --chuid {{ deploy_user }}
    --chdir {{ app_dir }} --startas /usr/bin/python3 -- {{ app_dir }}/app.py
  register: app_start
  changed_when: app_start.rc == 0
  failed_when: app_start.rc not in [0, 1]
  when: ansible_facts['service_mgr'] != 'systemd'