services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    image: alpine
    # This service only starts after api is confirmed healthy
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "echo 'API is healthy - worker starting' && sleep infinity"