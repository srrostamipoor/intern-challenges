---
name: Build and Promote

on:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/myapp

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short,priority=1000
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Smoke test the exact image from the registry
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker run -d --name app -p 8080:8080 "${IMAGE}:${IMAGE_TAG}"
          sleep 5
          curl -f http://localhost:8080/
          docker rm -f app

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, test-image]
    environment: staging
    steps:
      - name: Deploy SHA-tagged image to staging
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "Pulling ${IMAGE}:${IMAGE_TAG} onto staging server"
          # In practice: ssh into server, docker pull, docker restart

  promote-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag existing image as production (no rebuild)
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker pull "${IMAGE}:${IMAGE_TAG}"
          docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:production"
          docker push "${IMAGE}:production"
          docker image inspect "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:production" --format '{{.Id}}'
          echo "Promoted ${IMAGE_TAG} -> production (no rebuild)"
